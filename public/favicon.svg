<svg xmlns="http://www.w3.org/2000/svg" viewBox="78.275 74.325 240 240" width="32" height="32">
  <style>
    /* Capital J from Newsreader, weight 600, converted to an outline.
     *
     * It has to be a path rather than a text element: SVG favicons render
     * without access to external fonts, so a font-family reference would
     * silently fall back to whatever serif the OS happens to have.
     *
     * Weight 600 rather than the 500 the h1 uses — the extra stroke keeps the
     * serifs from disappearing at 16px.
     *
     * The viewBox is the glyph's own bounding box padded out to a square, so
     * the path needs no transform. Colours match --color-accent.
     *
     * Two things to keep in mind when editing this prose: a standalone SVG is
     * parsed as strict XML, so a double hyphen is illegal inside an XML
     * comment, and angle brackets are unsafe even in here, because XML parses
     * the contents of a style element as markup rather than as raw text. */
    .mark {
      fill: #a55535;
    }
    @media (prefers-color-scheme: dark) {
      .mark {
        fill: #ecae8e;
      }
    }
  </style>
